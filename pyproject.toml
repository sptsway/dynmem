[project]
name = "dynmem"
version = "0.1.0"
description = "Dynamic episodic memory for embodied agents: answering where-and-when questions after objects move"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "pydantic>=2",
  "qdrant-client",
  "sentence-transformers",
  "torch",
  "google-genai",
  "anthropic",
  "scipy",
  "remotezip",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dynmem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
